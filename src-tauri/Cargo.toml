[package]
name = "aside"
version = "0.1.0"
description = "A teleprompter that lives next to your mouse pointer"
authors = ["Francis Tin-ao"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "aside_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS need it, and so does tauri-nspanel.
# tray-icon: the menu bar extra and the Windows tray.
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Markdown to events for the tokenizer. No HTML renderer or CLI.
pulldown-cmark = { version = "0.13", default-features = false }
# UAX 29 word boundaries and grapheme counts, so Korean and other scripts work.
unicode-segmentation = "1.13"
# settings.json in the app config dir.
tauri-plugin-store = "2.5"
# Delete scripts to the OS Trash, never permanently.
trash = "5.2"
# Native folder picker, the Keep Mine / Load from Disk dialog, the macOS capture notice.
tauri-plugin-dialog = "2.8"
# Show in Finder / Show in Explorer and opening the scripts folder.
tauri-plugin-opener = "2.7"
# The scripts folder watcher, debounced 300 ms.
notify = "8.2"
notify-debouncer-full = "0.7"
# Remembers the Library window bounds. The prompter is denylisted.
tauri-plugin-window-state = "2.5"
# The global shortcuts, registered only while a session runs. Rust only.
tauri-plugin-global-shortcut = "2.4"
# Open at login: a LaunchAgent on macOS, a Run key on Windows. No signing involved.
tauri-plugin-autostart = "2.7"
# A second launch shows the Library instead of a second app. Registered first.
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
# Temp folders for the vault tests.
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# NSPanel conversion so the bubble shows over other apps' full screen Spaces.
tauri-nspanel = "2.1"
# Objective-C runtime and AppKit bindings: pointer, screens, window moves, sharing type.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(windows)'.dependencies]
# Cursor, keys, monitor, DPI, display affinity and the foreground hook. Same version as tauri and tao.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Build number through RtlGetVersion. Already in tao's dependency tree.
windows-version = "0.1"

# Speed over size; the app is small either way.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
